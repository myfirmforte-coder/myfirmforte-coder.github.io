# Ek dafa chalne wala kaam: purani WordPress site se images utha ke public/images/ mein save karta hai.
name: Save images from old site

on:
  push:
    paths: ['.github/workflows/fetch-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p public/images
          base="https://rank-ready.com/wp-content/uploads/2026"
          for f in 05/logo-reverse.png 04/logo-primary.png 05/Untitled-design-71.png 05/Untitled-design-72.png 05/Untitled-design-73.png 05/Untitled-design-75.png 05/Untitled-design-77.png 05/Untitled-design-78.png; do
            curl -fsSL -A "Mozilla/5.0" "${base}/${f}" -o "public/images/$(basename ${f})"
          done
          ls -la public/images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Save site images locally" || echo "nothing to commit"
          git push
