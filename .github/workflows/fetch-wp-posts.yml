# Ek dafa chalne wala kaam: purani WordPress site se blog posts aur un ki images
# PARH KE (sirf read, kuch change nahi) is repo mein save karta hai.
# (Dobara chalane ke liye is file mein koi bhi chhota sa change kar dein.)
name: Import blog posts from old site

on:
  push:
    paths: ['.github/workflows/fetch-wp-posts.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download posts and images
        run: node scripts/fetch-wp-posts.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wp-posts.json public/images/blog/wp
          git commit -m "Import blog posts from old site" || echo "nothing to commit"
          git pull --rebase
          git push
