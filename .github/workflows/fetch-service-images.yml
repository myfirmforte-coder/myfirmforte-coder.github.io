# Ek dafa chalne wala kaam: service pages ke liye Unsplash se photos utha ke public/images/services/ mein save karta hai.
name: Save service page images

on:
  push:
    paths: ['.github/workflows/fetch-service-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p public/images/services
          for pair in \
            web-1:1547658719-da2b51169166 web-2:1498050108023-c5249f4df085 web-3:1461749280684-dccba630e2f6 web-4:1559028012-481c04fa702d \
            web-5:1581291518857-4e27b48ff24e web-6:1555066931-4365d14bab8c web-7:1517694712202-14dd9538aa97 web-8:1504868584819-f8e8b4b6d7e3 \
            web-9:1551434678-e076c223a692 web-10:1586717791821-3f44a563fa4c ind-dental:1606811971618-4486d14f3f99 ind-medical:1519494026892-80bbd2d6fd0d \
            ind-shop:1556742049-0cfed4f6a45d ind-store:1472851294608-062f824d29cc ind-city:1486406146926-c627a92ad1ab ind-office:1497366811353-6870744d04b2 \
            seo-1:1432888622747-4eb9a8efeb07 seo-2:1460925895917-afdab827c52f geo-1:1677442136019-21780ecad995 audit-1:1454165804606-c3d57bc86b40 \
            ind-news:1504711434969-e33886168f5c ind-edu:1523240795612-9a054b0db644 \
            loc-map:1524661135-423995f22d0b loc-rest:1517248135467-4c7edcad34c4 loc-phone:1569336415962-a4bd9f69cd83 loc-street:1480714378408-67cf0d13bc1b \
            gmb-phone:1512941937669-90a1b58e7e9c gmb-owner:1556740758-90de374c12ad gmb-shop:1556745757-8d76bdb6984b auto-1:1487754180451-c456f719a1fc auto-2:1625047509248-ec889cbff17f \
            ai-hand:1620712943543-bcc4688e7485 ai-robot:1485827404703-89b55fcc595e ai-abstract:1531746790731-6c087fecd65a ai-chat:1676299081847-824916de030a \
            ai-woman:1573164713988-8665fc963095 speaker:1507146153580-69a1fe6d8aa1 ent-meet:1556761175-5973dc0f32e7 \
            leg-gavel:1589216532372-1c2a367900d9 leg-family:1511895426328-dc8714191300 leg-car:1532751203793-812308a10d8e leg-worker:1504307651254-35680f356dfd \
            leg-plane:1436491865332-7a61a109cc05 leg-passport:1569154941061-e231b4725ef1 leg-handshake:1521791136064-7986c2920216 \
            med-dentist:1588776814546-1ffcf47267a5 med-doctor:1559839734-2b71ea197ec2 med-eye:1574258495973-f010dfbb5371 med-spa:1570172619644-dfd03ed5d881 \
            med-steth:1505751172876-fa1923c5c528 med-therapy:1573497019940-1c28c88b4f3e med-tablet:1576091160550-2173dba999ef \
            dent-2:1629909613654-28e377c37b09 dent-3:1606811841689-23dfddce3e95 dent-4:1609840114035-3c981b782dfe dent-5:1588776814546-daab30f310ce; do
            name="${pair%%:*}"; id="${pair#*:}"
            curl -fsSL "https://images.unsplash.com/photo-$id?w=1200&h=850&fit=crop&q=72&fm=jpg" -o "public/images/services/$name.jpg" || echo "FAILED $name"
          done
          ls -la public/images/services
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/services
          git commit -m "Save service page images" || echo "nothing to commit"
          git pull --rebase
          git push
